<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIS Automation — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #08080f;
    --card:    #0f0f1e;
    --border:  #1e1e3a;
    --accent:  #4f8ef7;
    --accent2: #7c3aed;
    --green:   #2ecc71;
    --red:     #e74c3c;
    --yellow:  #f39c12;
    --text:    #e8eaf6;
    --sub:     #6b7280;
    --font:    'Space Grotesk', sans-serif;
    --mono:    'JetBrains Mono', monospace;
  }

  body {
    background: var(--bg);
    font-family: var(--font);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(79,142,247,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,142,247,.04) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
  }
  @keyframes gridMove {
    0%   { transform: translateY(0); }
    100% { transform: translateY(48px); }
  }

  /* Glow orbs */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .18;
    pointer-events: none;
    animation: pulse 6s ease-in-out infinite alternate;
  }
  .orb1 { width: 400px; height: 400px; background: var(--accent2); top: -100px; left: -100px; }
  .orb2 { width: 300px; height: 300px; background: var(--accent);  bottom: -80px; right: -80px; animation-delay: -3s; }
  @keyframes pulse { from { opacity: .12; } to { opacity: .22; } }

  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 44px;
    width: 100%;
    max-width: 420px;
    margin: 20px;
    box-shadow: 0 0 0 1px rgba(79,142,247,.08), 0 32px 64px rgba(0,0,0,.6);
    animation: slideUp .5s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(32px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .logo-text { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -.3px; }
  .subtitle  { font-size: 13px; color: var(--sub); margin-bottom: 36px; margin-top: 4px; }

  .field { margin-bottom: 20px; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    background: #0a0a1a;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    font-family: var(--font);
    font-size: 15px;
    color: var(--text);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,142,247,.15);
  }
  .field input::placeholder { color: #3a3a5c; }

  .btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity .2s, transform .15s;
    letter-spacing: .2px;
  }
  .btn:hover { opacity: .92; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .error-box {
    background: rgba(231,76,60,.1);
    border: 1px solid rgba(231,76,60,.3);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: #e74c3c;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(79,142,247,.1);
    border: 1px solid rgba(79,142,247,.2);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .tag::before { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: blink 2s ease infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
</style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="card">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <span class="logo-text">MIS Automation</span>
  </div>
  <p class="subtitle">Excel Currency Formatter — Secure Access</p>

  <div class="tag">Secured Portal</div>

  {% if error %}
  <div class="error-box">⚠ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
    </div>
    <button class="btn" type="submit">Sign In →</button>
  </form>
</div>
</body>
</html>
